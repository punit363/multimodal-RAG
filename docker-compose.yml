services:
  backend:
    build:
      context: ./mmr-backend
    env_file:
      - ./mmr-backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-docs:/app/docs
      - backend-db:/app/db
      - backend-history:/app/data
    environment:
      RAG_DATABASE_PATH: /app/data/rag_history.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./mmr-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-docs:
  backend-db:
  backend-history:

